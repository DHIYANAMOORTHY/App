<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 RAG Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: linear-gradient(135deg, #74ebd5, #acb6e5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.chatbox {
    background: #fff;
    width: 100%;
    max-width: 600px;
    height: 80vh;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    padding: 20px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
    background: #6c63ff;
    color: #fff;
}

.chat-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #f5f7ff;
}

.message {
    max-width: 80%;
    padding: 12px 16px;
    margin-bottom: 12px;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1.4;
}

.user {
    background: #6c63ff;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.bot {
    background: #ffffff;
    color: #333;
    border: 1px solid #ddd;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

form {
    display: flex;
    padding: 15px;
    border-top: 1px solid #ddd;
    background: #fff;
}

input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #6c63ff;
}

button {
    margin-left: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #6c63ff;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #574bff;
}
</style>
</head>

<body>

<div class="chatbox">
    <div class="header">📄 CSV-based RAG Chatbot</div>

    <div class="chat-area">
        {% if query %}
        <div class="message user">
            {{ query }}
        </div>
        {% endif %}

        {% if answer %}
        <div class="message bot">
            {{ answer }}
        </div>
        {% endif %}
    </div>

    <form method="POST">
        <input type="text" name="query" placeholder="Ask something from CSV..." required>
        <button type="submit">Send</button>
    </form>
</div>

</body>
</html>
